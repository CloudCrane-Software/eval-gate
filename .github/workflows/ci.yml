# eval-gate CI 门禁（D1-R2 修复：本仓此前 108 例回归无任何仓内推送触发的自动门禁——
# 回归只能等 company-ops CNB 流水线才暴露。对齐 D1-R1 先例：session-broker/skill-pack
# 各有 ci.yml）。
# 元资产纪律（PROP-0001 v2.1 §11/§14）：本文件改动强制 owner PR 审（zizmor 常开）。
# 口径：仓根裸 pytest 全量，floor 断言随上游如实核查回填（只升不降，不许静默放行）；
# 当前 floor=108 对应 D1-R2 本地实测 108 passed（main=c71c4e6 树 + 本文件）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install pytest -e .
      - name: pytest with floor
        run: |
          set -e
          python -m pytest > pytest.log 2>&1 || { tail -30 pytest.log; exit 1; }
          tail -3 pytest.log
          N="$(grep -oE '[0-9]+ passed' pytest.log | tail -1 | grep -oE '[0-9]+')"
          [ -n "$N" ] || { echo "cannot parse passed count"; tail -30 pytest.log; exit 1; }
          [ "$N" -ge 108 ] || { echo "passed=$N < 108 (upstream changed? re-verify and re-ratchet, never silently loosen)"; exit 1; }
          echo "eval-gate floor OK: $N passed (>= 108)"
