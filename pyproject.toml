[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-gate"
version = "0.2.0"
description = "公司级评测门禁：CI 三层（L1 级联漏斗 / L2 oracle 差分 / L3 GuardrailRun 门禁）+ 安全扫描三档（PROP-0001 v1.7 §6/§12.9，WO-0004）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "CloudCrane-Software" }]
# 运行时零第三方依赖：标准库 only；扫描器只经 subprocess 调其 CLI（import 依赖为零）。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
